name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'examples/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'examples/**'
      - '.claude/**'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build
