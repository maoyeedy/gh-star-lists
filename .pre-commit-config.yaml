repos:
  - repo: local
    hooks:
      - id: goimports
        name: goimports
        language: system
        entry: go tool goimports -w
        types: [go]
        pass_filenames: true

      - id: go-vet
        name: go vet
        language: system
        entry: go vet ./...
        types: [go]
        pass_filenames: false

      - id: ascii-check
        name: ascii-check (no non-ASCII in Go source)
        language: system
        entry: bash -c 'if LC_ALL=C grep -Pn "[^\x00-\x7F]" --include="*.go" -r . 2>/dev/null; then echo "ERROR: non-ASCII found"; exit 1; fi'
        pass_filenames: false
        always_run: true
